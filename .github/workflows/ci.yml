name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify on macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Verify app icon assets
        run: |
          test -s Resources/AppIcon.icns
          test "$(sips -g pixelWidth Resources/AppIcon.icns | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight Resources/AppIcon.icns | awk '/pixelHeight/ {print $2}')" = "1024"
          bash -n scripts/run-app.sh
      - name: Build
        run: swift build --jobs 1
      - name: Run integration verifier
        run: swift run RecallVerifier
      - name: Render native page layouts
        run: swift run RecallApp --layout-previews /tmp/recall-layout-previews
        timeout-minutes: 3
      - name: Upload page layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-page-layouts
          path: /tmp/recall-layout-previews/*.png
          if-no-files-found: warn

  compatibility:
    name: Build and verify with Xcode 16.2
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show compatibility toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build with the Swift 6.0 toolchain
        run: swift build --jobs 1
      - name: Run integration verifier
        run: swift run RecallVerifier
      - name: Render native page layouts with Xcode 16.2
        run: swift run RecallApp --layout-previews /tmp/recall-compat-previews
        timeout-minutes: 3
      - name: Upload compatibility layouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-page-layouts-xcode-16-2
          path: /tmp/recall-compat-previews/*.png
          if-no-files-found: warn
